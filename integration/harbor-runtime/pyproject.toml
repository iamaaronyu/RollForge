[project]
name = "rollforge-runtime-spike"
version = "0.1.0"
description = "Isolated, pinned Harbor runtime validation environment"
requires-python = ">=3.12"
dependencies = [
  "harbor[e2b]==0.24.0",
  "e2b==2.46.0",
  "rollforge-harbor-adapter",
  "python-dotenv>=1.2,<2",
  "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
rollforge-harbor-adapter = { path = "../../packages/harbor-adapter", editable = true }
rollforge-schemas = { path = "../../packages/schemas", editable = true }
rollforge-sandbox-provider = { path = "../../packages/sandbox-provider", editable = true }
