[project]
name = "rollforge"
version = "0.1.0"
description = "Open agent rollout and evaluation control plane"
requires-python = ">=3.11"
dependencies = ["rollforge-api", "rollforge-worker", "rollforge-scheduler"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/hub-api", "services/*", "packages/*"]

[tool.uv.sources]
rollforge-api = { workspace = true }
rollforge-worker = { workspace = true }
rollforge-scheduler = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1", "aiosqlite>=0.20,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
