name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.11"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m rollforge_worker --check
      - run: uv run python -m rollforge_scheduler --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/hub-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
