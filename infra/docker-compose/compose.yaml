name: rollforge
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in a protected infra env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in a protected infra env file}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in a protected infra env file}
    ports: ["127.0.0.1:${ROLLFORGE_POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${ROLLFORGE_REDIS_HOST_PORT:-56379}:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in a protected infra env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in a protected infra env file}
    ports:
      - "127.0.0.1:${ROLLFORGE_MINIO_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${ROLLFORGE_MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  minio-data:
