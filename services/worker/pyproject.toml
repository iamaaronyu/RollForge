[project]
name = "rollforge-worker"
version = "0.1.0"
description = "RollForge worker"
requires-python = ">=3.11"
dependencies = ["rollforge-schemas", "rollforge-common", "rollforge-harbor-adapter", "rollforge-hub-sdk", "rollforge-object-store", "python-dotenv>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_worker"]

[tool.uv.sources]
rollforge-schemas = { workspace = true }
rollforge-common = { workspace = true }
rollforge-harbor-adapter = { workspace = true }
rollforge-hub-sdk = { workspace = true }
rollforge-object-store = { workspace = true }
