[project]
name = "rollforge-scheduler"
version = "0.1.0"
description = "RollForge scheduler"
requires-python = ">=3.11"
dependencies = ["rollforge-schemas", "rollforge-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_scheduler"]

[tool.uv.sources]
rollforge-schemas = { workspace = true }
rollforge-common = { workspace = true }
