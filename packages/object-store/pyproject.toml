[project]
name = "rollforge-object-store"
version = "0.1.0"
description = "RollForge immutable execution output storage"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "rollforge-schemas", "rollforge-harbor-adapter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_object_store"]

[tool.uv.sources]
rollforge-schemas = { workspace = true }
rollforge-harbor-adapter = { workspace = true }
