[project]
name = "rollforge-hub-sdk"
version = "0.1.0"
description = "RollForge hub-sdk"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "rollforge-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_hub_sdk"]

[tool.uv.sources]
rollforge-schemas = { workspace = true }
