[project]
name = "rollforge-common"
version = "0.1.0"
description = "RollForge common"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_common"]
