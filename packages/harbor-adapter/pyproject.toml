[project]
name = "rollforge-harbor-adapter"
version = "0.1.0"
description = "RollForge harbor-adapter"
requires-python = ">=3.11"
dependencies = ["rollforge-schemas", "rollforge-sandbox-provider"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollforge_harbor_adapter"]

[tool.uv.sources]
rollforge-schemas = { workspace = true }
rollforge-sandbox-provider = { workspace = true }
